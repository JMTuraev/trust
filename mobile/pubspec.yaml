name: trust_mobile
description: "Trust — ishonchli hisob-kitob. UI prototip bilan 1:1 (prototype/template.html)."
publish_to: "none"
# 3.13.0 (2026-09-08): v2 REDIZAYN — "dark glass + gradient" (Claude Design):
#          yangi dizayn tizimi (theme.dart/ui.dart: aurora fon, shisha kartalar,
#          violet→cyan gradient, mint/coral/amber pul ranglari, Plus Jakarta Sans /
#          Inter Tight / Space Grotesk), barcha ekranlar qayta chizildi (Bosh 2×2
#          modul kartalar, Daftar, Hamkor chati, Onboarding 3 slayd, Profil,
#          Bildirishnoma, Paywall, Xarajat, Ijara, To'yxona, Trust AI). Mantiq/
#          backend o'zgarmagan. Spec: prototype/redesign/DESIGN_SPEC.md
# 3.12.1 (2026-08-13): Apple 2.1(a) reject (iPad oq ekran) tuzatildi — runApp
#          endi DARHOL chaqiriladi (birinchi kadr har doim chiziladi), store/push
#          init fonda timeout+try/catch bilan, keychain o'qish/yozish himoyalangan
#          (istisno otmaydi), boot-splash zaxirasi welcome'ga o'tkazadi.
# 3.12.0 (2026-08-10): ijara/to'yxona modullari mukammallashtirildi, audit
#          tuzatishlari: back-tugma (yordam chati / davlat-kodi varag'i / OTP),
#          IAP pending/restore/lokalizatsiya, arxiv qatori, qulf endi kirishni
#          to'smaydi, tizim sana tanlagichi ilova tilida (flutter_localizations).
# 3.11.0 (2026-08-08): App Store qayta submit. Har bo'lim uchun ALOHIDA obuna
#          (xarajat/qarz/ijarachi/toyxona), "Ijaradagi uylar" va "To'yxona"
#          modullari, modul paywall'ida Apple 3.1.2 bloki (avtoyangilanish +
#          Xaridni tiklash + EULA + Maxfiylik).
# 3.10.1 (2026-08-06): bildirishnoma badge'lari realtime, filtr dropdown birlashtirildi.
# 3.10.0 (2026-08-05): xarajat UX sayqali, qarz-daftar chat bosqichi.
# 3.9.2 (2026-08-05): yozuvni papkalar orasida ko'chirish UI, ferma konteksti.
# 3.9.0 (2026-08-04): xarajat kiritish faqat qizil, qarz xarajatdan ajratildi,
#          LLM Anthropic API'ga o'tkazildi, 6 tilda birliklar.
# 3.8.0+6 (2026-08-03): 2026-08-02 audit tuzatishlari (xavfsizlik/pul hisobi/crash'lar),
#          toifa bug: 'Boshqa' lug'at zaharlanishi + tray tanlovi yo'qolishi tuzatildi,
#          manba ichi kirim paneli yangi UI (katta Summa, guruhlash, Qo'shish tugmasi),
#          papka/manba summasi 0->n o'sish animatsiyasi, bepul limit 300 (server).
# 3.7.0+5 (2026-07-29): Daromad v2 (sub-manbalar, qoldiq, @ tanlov popup, kirim-chiqim
#          oqimi), yangi in-app Trustbook logo, OTP bilan profil o'chirish, 3-nuqta menyu +
#          o'chirish tasdiq/spinner, barcha tugmalarda bosish effekti, avto-ochilish bug fix
# 3.6.0+4 (2026-07-28): Apple IAP (StoreKit $9/oy premium) + iOS App Store tayyorgarlik.
# 3.5.0+3: FCM push, Trustbook rebrand + bloknot ikonka, yordam chati, 8 xonali user ID,
#          yangi tarif (server-side), klaviatura haptic, to'liq izohlar
# 3.14.0+12 (2026-09-09): To'yxona servislari v3 — platforma KATEGORIYALARI (17+boshqa,
#          Storyset illyustratsiya, shisha kartalar), item'da rasm (Supabase Storage,
#          backend orqali yuklash) + tavsif, bron formasida kategoriya bo'yicha rasmli
#          tanlov, chekda kategoriya guruhlari. Migratsiya 025.
version: 3.19.0+17

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Tizim vidjetlari (sana tanlagich va h.k.) 6 tilda — MaterialApp delegatlari (main.dart)
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  # Firebase push bildirishnomalar (FCM)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  # Apple App Store ichki xarid (StoreKit) — $9/oy premium obuna (iOS). iap.dart.
  in_app_purchase: ^3.2.0
  # Paywall'da Foydalanish shartlari / Maxfiylik havolalari (Apple 3.1.2)
  url_launcher: ^6.3.0
  # To'yxona chek/PDF (024): bron cheki — stol, servislar, bonus, avans, qoldiq, jarima
  # shartlari. printing — ulashish varag'i (share sheet) + PdfGoogleFonts (kirill uchun).
  pdf: ^3.11.1
  printing: ^5.13.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Brendlangan launcher ikoni (default Flutter beige o'rniga) — "T" logo, ilova splashiga mos.
# Generatsiya: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    # Trustbook belgisi (qalqon+daftar, oq/shaffof) — ilova ichidagi logo (ui.dart TrustMark)
    - assets/icon/mark.png
    # Hub/onboarding illyustratsiyalari (Storyset, shaffof PNG 768px)
    - assets/illustrations/
    # To'yxona servis KATEGORIYALARI (025): Storyset PNG, fayl nomi = slug
    # (taomnoma.png, tort.png ...). Fayl bo'lmasa UI ikonkaga qaytadi.
    - assets/toyxona/cat/
