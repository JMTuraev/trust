# Render.com blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard -> New -> Blueprint -> shu repo'ni tanlang.
services:
  - type: web
    name: trust-backend
    runtime: node
    region: frankfurt # O'zbekistonga eng yaqin region
    plan: starter # uxlamaydi (cold start yo'q), real foydalanuvchilar uchun
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false # qiymatlar Dashboard'da qo'lda kiritiladi (maxfiy)
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true # Render o'zi kuchli qiymat yaratadi
      - key: DEVSMS_TOKEN
        sync: false
      - key: SMS_SERVICE_NAME
        value: AllClubs
      - key: SMS_TEMPLATE_TYPE
        value: "4"
      - key: OTP_TTL_SECONDS
        value: "300"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      # Do'kon review (Google Play / App Store) test-login: AYNAN shu raqam uchun
      # haqiqiy SMS yuborilmaydi va kod qat'iy. Boshqa raqamlarga ta'siri yo'q.
      # MUHIM: repo PUBLIC — qiymatlar bu yerga YOZILMAYDI va IZOHDA HAM KO'RSATILMAYDI
      # (2026-08-02 audit: ilgari aynan tavsiya qilingan raqam va kod shu yerda yozilgan
      # edi — ya'ni "maxfiy" bypass kalitlari ochiq repoda turardi).
      # Ikkala qiymat FAQAT Render Dashboard'da kiritiladi (sync:false).
      # O'rnatilmasa bypass o'chiq (xavfsiz default).
      # Tavsiya: REVIEW_TEST_CODE kamida 12 belgi, tasodifiy. Review tugagach ikkalasini
      # Dashboard'dan O'CHIRIB, bypass'ni butunlay yoping.
      - key: REVIEW_TEST_PHONE
        sync: false
      - key: REVIEW_TEST_CODE
        sync: false
      # SMS toll-fraud: butun servis bo'yicha soatlik OTP capi (devsms balansini himoya)
      - key: SMS_GLOBAL_HOURLY_CAP
        value: "200"
      # 2026-07-17: STT_ENABLED OLIB TASHLANDI — ovoz/STT mahsulotdan chiqarildi
      # (mahsulot qarori: FAQAT MATN, docs/ai-character.md §11). Mikrofon ruxsati ham yo'q.
      # LLM parsing (matn->xarajat/qarz) STT'ga BOG'LIQ EMAS — quyidagi kalitlar kerak.
      #
      # LLM parsing (matn->xarajat/qarz, src/services/parse.js) zanjiri (2026-08-03 PO):
      # ASOSIY — Anthropic Claude (ANTHROPIC_API_KEY pastda, Trust AI bilan bitta kalit;
      # parsing modeli ANTHROPIC_MODEL). Sabab: Groq bepul kvotasi (100k token/kun) tugab,
      # parsing qoida-parserga tushib qolgan edi.
      # Zaxira 1 — Groq (kvota tugasa avtomatik keyingisiga o'tadi).
      - key: GROQ_API_KEY
        sync: false
      # Zaxira 2 — OpenAI (gpt-4o-mini)
      - key: OPENAI_API_KEY
        sync: false
      # LLM modellari (ixtiyoriy — defaultlari kodda bor)
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      # Token tejash (2026-08-03 PO: balans kichik): per-user kunlik Anthropic chaqiruv
      # limiti va butun servis bo'yicha kunlik token kill-switch (oshsa parsing
      # Groq/OpenAI/qoidalar zanjiriga tushadi — xizmat TO'XTAMAYDI)
      - key: ANTHROPIC_USER_DAILY_MAX
        value: "40"
      - key: ANTHROPIC_DAILY_TOKEN_MAX
        value: "300000"
      - key: GROQ_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_LLM_MODEL
        value: gpt-4o-mini
      # ---- Trust AI (moliyaviy hamroh chat, docs/ai-character.md) ----
      # MAJBURIY: Anthropic kaliti — Trust AI chat (Claude Opus 4.8, AI_MODEL) VA
      # LLM parsing (claude-haiku-4-5, ANTHROPIC_MODEL, 2026-08-03) BITTA shu kalitdan.
      # Dashboard'da qo'lda kiritiladi. Kalitsiz chat zaxiraga (Groq) tushadi.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Favqulodda o'chirgich: "false" -> /api/ai/chat 503 (tarix o'qish ochiq qoladi)
      - key: AI_ENABLED
        value: "true"
      - key: AI_MODEL
        value: claude-opus-4-8
      # 1200: Opus tool-JSON'i 400 da KESILIB bloklar bo'sh -> fallback bo'lardi
      # (stop=max_tokens, 2026-07-17 diagnostikasi). Bu qiymat config.js defaultini
      # BEKOR QILADI — o'zgartirganda ikkalasini sinxron tut.
      - key: AI_MAX_TOKENS
        value: "1200"
      # Limitlar SUIISTE'MOLGA qarshi, ratsion uchun EMAS (PO qarori) — saxiy.
      # 100/kun, 1000/oy (PO 2026-07-17: "AI dialog saxiyroq ko'rinsin").
      - key: AI_DAILY_LIMIT
        value: "100"
      - key: AI_MONTHLY_LIMIT
        value: "1000"
      - key: AI_MINUTE_LIMIT
        value: "5"
      # Agregat kontekst keshi (ai_profile). Kesh prompt caching'ni ham ushlab turadi.
      - key: AI_PROFILE_TTL_HOURS
        value: "6"
      # Narx ($/1M token) — FAQAT ai_usage.cost_usd auditi uchun. PO Anthropic
      # tarif sahifasidan tekshirib qo'ysin (noto'g'ri qiymat hisobotni buzadi, xizmatni emas).
      - key: AI_PRICE_IN
        value: "5"
      - key: AI_PRICE_CACHE_WRITE
        value: "6.25"
      - key: AI_PRICE_CACHE_READ
        value: "0.5"
      - key: AI_PRICE_OUT
        value: "25"
      # Link modeli sozlamalari (ixtiyoriy — defaultlari kodda bor)
      - key: REJECT_SIGNAL_DELAY_HOURS
        value: "24"
      - key: PARTNER_DAILY_LIMIT
        value: "20"
      - key: REJECT_FLAG_COUNT
        value: "3"
      - key: REJECT_FLAG_WINDOW_HOURS
        value: "72"
